# ============================================
# CLOUDFLARE WORKERS CONFIGURATION
# ============================================

name = "real-estate-panel"
main = "workers.js"
compatibility_date = "2024-12-18"

# ============================================
# KV NAMESPACE
# ============================================
# 🔴 IMPORTANT: Replace 'your-kv-namespace-id' with your actual KV ID
# To create KV namespace: wrangler kv:namespace create "KV"
# ============================================

[[kv_namespaces]]
binding = "KV"
id = "your-kv-namespace-id"  # ← Replace this with your KV ID

# ============================================
# ENVIRONMENT VARIABLES
# ============================================

[vars]
ENVIRONMENT = "production"
APP_VERSION = "1.0.0"

# ============================================
# PREVIEW CONFIGURATION (For development)
# ============================================

[env.preview]
[[env.preview.kv_namespaces]]
binding = "KV"
id = "your-preview-kv-namespace-id"  # ← Optional: for development