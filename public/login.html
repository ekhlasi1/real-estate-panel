<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ورود | املاک اخلاصی</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="/style.css" />
</head>
<body>

<div class="login-page">
    <div class="login-bg-shape"></div>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="login-icon"><i class="fas fa-crown"></i></div>
                <h1>املاک <span>اخلاصی</span></h1>
                <p>ورود به پنل مدیریت</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> نام کاربری</label>
                    <input type="text" id="login-username" placeholder="admin" required />
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> رمز عبور</label>
                    <input type="password" id="login-password" placeholder="••••••••" required />
                </div>
                <button type="submit" class="btn-primary full">
                    <i class="fas fa-sign-in-alt"></i> ورود
                </button>
                <div class="login-error" id="login-error"></div>
                <div class="login-footer">
                    <a href="/change-password.html">تغییر رمز عبور</a>
                    <span>|</span>
                    <span>رمز پیش‌فرض: <strong>admin123</strong></span>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.getElementById('login-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value.trim();
    const error = document.getElementById('login-error');

    const savedPassword = localStorage.getItem('realestate_admin_password') || 'admin123';

    if (username === 'admin' && password === savedPassword) {
        localStorage.setItem('realestate_logged_in', 'true');
        window.location.href = '/admin.html';
    } else {
        error.textContent = '❌ نام کاربری یا رمز عبور اشتباه است';
        error.style.display = 'block';
        setTimeout(() => { error.style.display = 'none'; }, 3000);
    }
});
</script>

</body>
</html>
