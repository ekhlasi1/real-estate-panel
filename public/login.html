<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ورود | املاک اخلاصی</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="/style.css" />
</head>
<body>

    <header class="navbar">
        <div class="container">
            <a href="/" class="logo">
                <i class="fas fa-crown"></i>
                <span>اخلاصی</span>
            </a>
            <nav class="nav" id="mainNav">
                <a href="/#properties">ملک‌ها</a>
                <a href="/#advisors">مشاورین</a>
                <a href="/commission.html">کمیسیون</a>
                <a href="/#about">درباره</a>
                <a href="/request.html">کارشناسی</a>
            </nav>
            <div class="nav-actions">
                <button class="btn-gold" onclick="window.location.href='/login.html'">
                    <i class="fas fa-plus-circle"></i> ثبت آگهی
                </button>
                <button class="btn-ghost active" onclick="window.location.href='/login.html'">
                    <i class="fas fa-user"></i>
                </button>
                <button class="menu-toggle" id="menuToggle">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
    </header>

    <section class="auth-page">
        <div class="auth-bg">
            <div class="auth-glow"></div>
        </div>
        <div class="container">
            <div class="auth-wrapper">
                <div class="auth-box glass">
                    <div class="auth-header">
                        <div class="auth-icon"><i class="fas fa-crown"></i></div>
                        <h1>خوش آمدید</h1>
                        <p>وارد پنل مدیریت <span>املاک اخلاصی</span> شوید</p>
                    </div>
                    <form id="loginForm">
                        <div class="form-group">
                            <label><i class="fas fa-user"></i> نام کاربری</label>
                            <input type="text" id="loginUsername" placeholder="نام کاربری خود را وارد کنید" required />
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-lock"></i> رمز عبور</label>
                            <input type="password" id="loginPassword" placeholder="رمز عبور خود را وارد کنید" required />
                        </div>
                        <button type="submit" class="btn-primary full">
                            <i class="fas fa-sign-in-alt"></i> ورود به پنل مدیریت
                        </button>
                        <div class="auth-error" id="loginError"></div>
                        <div class="auth-footer">
                            <a href="/change-password.html">تغییر رمز عبور</a>
                            <span>|</span>
                            <span>رمز پیش‌فرض: <strong>admin123</strong></span>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <script src="/script.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const error = document.getElementById('loginError');

            const savedPassword = localStorage.getItem('realestate_admin_password') || 'admin123';

            if (username === 'admin' && password === savedPassword) {
                localStorage.setItem('realestate_logged_in', 'true');
                window.location.href = '/admin.html';
            } else {
                error.textContent = '❌ نام کاربری یا رمز عبور اشتباه است';
                error.style.display = 'block';
                setTimeout(() => { error.style.display = 'none'; }, 3000);
            }
        });

        document.getElementById('menuToggle').addEventListener('click', function() {
            const nav = document.getElementById('mainNav');
            nav.classList.toggle('open');
            this.classList.toggle('active');
        });
    </script>

</body>
</html>
