<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تغییر رمز | املاک اخلاصی</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="/style.css" />
</head>
<body>

    <header class="header" id="header">
        <div class="container">
            <a href="/" class="logo">
                <i class="fas fa-crown"></i>
                <span>املاک <strong>اخلاصی</strong></span>
            </a>
            <nav class="nav" id="mainNav">
                <a href="/#properties">ملک‌ها</a>
                <a href="/#advisors">مشاورین</a>
                <a href="/commission.html">کمیسیون</a>
                <a href="/#about">درباره ما</a>
                <a href="/request.html">کارشناسی</a>
            </nav>
            <div class="header-actions">
                <button class="btn-primary" onclick="window.location.href='/login.html'">
                    <i class="fas fa-plus-circle"></i> ثبت آگهی
                </button>
                <button class="btn-outline-sm" onclick="window.location.href='/login.html'">
                    <i class="fas fa-user"></i> ورود
                </button>
                <button class="menu-toggle" id="menuToggle" aria-label="منو">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
    </header>

    <section class="auth-page">
        <div class="container">
            <div class="auth-wrapper">
                <div class="auth-box">
                    <div class="auth-header">
                        <div class="auth-icon"><i class="fas fa-key"></i></div>
                        <h1>تغییر رمز عبور</h1>
                        <p>رمز عبور جدید خود را وارد کنید</p>
                    </div>
                    <form id="changePasswordForm">
                        <div class="form-group">
                            <label><i class="fas fa-lock"></i> رمز فعلی</label>
                            <input type="password" id="currentPassword" required placeholder="رمز فعلی را وارد کنید" />
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-lock"></i> رمز جدید</label>
                            <input type="password" id="newPassword" required placeholder="رمز جدید (حداقل ۶ کاراکتر)" />
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-check-circle"></i> تکرار رمز جدید</label>
                            <input type="password" id="confirmPassword" required placeholder="رمز جدید را مجدداً وارد کنید" />
                        </div>
                        <button type="submit" class="btn-primary full">
                            <i class="fas fa-save"></i> تغییر رمز
                        </button>
                        <div class="auth-error" id="changeError"></div>
                        <div class="auth-footer">
                            <a href="/login.html">بازگشت به ورود</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <script src="/script.js"></script>
    <script>
        document.getElementById('changePasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const current = document.getElementById('currentPassword').value.trim();
            const newPass = document.getElementById('newPassword').value.trim();
            const confirmPass = document.getElementById('confirmPassword').value.trim();
            const error = document.getElementById('changeError');

            const userType = localStorage.getItem('realestate_user_type');
            const advisorId = localStorage.getItem('realestate_advisor_id');

            if (userType === 'admin') {
                const savedPassword = localStorage.getItem('realestate_admin_password') || 'admin123';
                if (current !== savedPassword) {
                    error.textContent = '❌ رمز فعلی اشتباه است';
                    error.style.display = 'block';
                    setTimeout(() => { error.style.display = 'none'; }, 3000);
                    return;
                }
                if (newPass.length < 6) {
                    error.textContent = '❌ رمز جدید باید حداقل ۶ کاراکتر باشد';
                    error.style.display = 'block';
                    setTimeout(() => { error.style.display = 'none'; }, 3000);
                    return;
                }
                if (newPass !== confirmPass) {
                    error.textContent = '❌ رمز جدید و تکرار آن مطابقت ندارند';
                    error.style.display = 'block';
                    setTimeout(() => { error.style.display = 'none'; }, 3000);
                    return;
                }
                localStorage.setItem('realestate_admin_password', newPass);
                error.textContent = '✅ رمز مدیر با موفقیت تغییر کرد';
                error.style.color = '#28a745';
                error.style.display = 'block';
                setTimeout(() => { window.location.href = '/login.html'; }, 2000);
            } else if (userType === 'advisor' && advisorId) {
                const advisors = await fetch('/api/advisors').then(r => r.json());
                const advisor = advisors.find(a => a.id === advisorId);
                if (!advisor) {
                    error.textContent = '❌ مشاور یافت نشد';
                    error.style.display = 'block';
                    setTimeout(() => { error.style.display = 'none'; }, 3000);
                    return;
                }
                if (current !== advisor.password) {
                    error.textContent = '❌ رمز فعلی اشتباه است';
                    error.style.display = 'block';
                    setTimeout(() => { error.style.display = 'none'; }, 3000);
                    return;
                }
                if (newPass.length < 6) {
                    error.textContent = '❌ رمز جدید باید حداقل ۶ کاراکتر باشد';
                    error.style.display = 'block';
                    setTimeout(() => { error.style.display = 'none'; }, 3000);
                    return;
                }
                if (newPass !== confirmPass) {
                    error.textContent = '❌ رمز جدید و تکرار آن مطابقت ندارند';
                    error.style.display = 'block';
                    setTimeout(() => { error.style.display = 'none'; }, 3000);
                    return;
                }
                advisor.password = newPass;
                await fetch('/api/advisors', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(advisor)
                });
                error.textContent = '✅ رمز مشاور با موفقیت تغییر کرد';
                error.style.color = '#28a745';
                error.style.display = 'block';
                setTimeout(() => { window.location.href = '/login.html'; }, 2000);
            } else {
                error.textContent = '❌ لطفاً ابتدا وارد شوید';
                error.style.display = 'block';
                setTimeout(() => { error.style.display = 'none'; }, 3000);
                window.location.href = '/login.html';
            }
        });

        document.getElementById('menuToggle').addEventListener('click', function() {
            const nav = document.getElementById('mainNav');
            nav.classList.toggle('open');
            this.classList.toggle('active');
        });
    </script>

</body>
</html>
