<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تغییر رمز عبور | املاک اخلاصی</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="/style.css" />
</head>
<body>

<div class="login-page">
    <div class="login-bg-shape"></div>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="login-icon"><i class="fas fa-key"></i></div>
                <h1>تغییر <span>رمز عبور</span></h1>
                <p>رمز عبور جدید خود را وارد کنید</p>
            </div>

            <form id="change-password-form">
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> رمز فعلی</label>
                    <input type="password" id="current-password" required placeholder="رمز فعلی را وارد کنید" />
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> رمز جدید</label>
                    <input type="password" id="new-password" required placeholder="رمز جدید (حداقل ۶ کاراکتر)" />
                </div>
                <div class="form-group">
                    <label><i class="fas fa-check-circle"></i> تکرار رمز جدید</label>
                    <input type="password" id="confirm-password" required placeholder="رمز جدید را مجدداً وارد کنید" />
                </div>
                <button type="submit" class="btn-primary full">
                    <i class="fas fa-save"></i> تغییر رمز
                </button>
                <div class="login-error" id="change-error"></div>
                <div class="login-footer">
                    <a href="/login.html">بازگشت به ورود</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.getElementById('change-password-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const current = document.getElementById('current-password').value.trim();
    const newPass = document.getElementById('new-password').value.trim();
    const confirmPass = document.getElementById('confirm-password').value.trim();
    const error = document.getElementById('change-error');

    const savedPassword = localStorage.getItem('realestate_admin_password') || 'admin123';

    if (current !== savedPassword) {
        error.textContent = '❌ رمز فعلی اشتباه است';
        error.style.display = 'block';
        setTimeout(() => { error.style.display = 'none'; }, 3000);
        return;
    }

    if (newPass.length < 6) {
        error.textContent = '❌ رمز جدید باید حداقل ۶ کاراکتر باشد';
        error.style.display = 'block';
        setTimeout(() => { error.style.display = 'none'; }, 3000);
        return;
    }

    if (newPass !== confirmPass) {
        error.textContent = '❌ رمز جدید و تکرار آن مطابقت ندارند';
        error.style.display = 'block';
        setTimeout(() => { error.style.display = 'none'; }, 3000);
        return;
    }

    localStorage.setItem('realestate_admin_password', newPass);
    error.style.color = 'var(--success)';
    error.textContent = '✅ رمز عبور با موفقیت تغییر کرد';
    error.style.display = 'block';
    setTimeout(() => {
        window.location.href = '/login.html';
    }, 2000);
});
</script>

</body>
</html>
