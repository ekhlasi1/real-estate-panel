<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تغییر رمز | املاک اخلاصی</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="/style.css" />
</head>
<body>

<!-- HEADER -->
<header class="header">
    <div class="container">
        <div class="header-left">
            <a href="/" class="logo">
                <i class="fas fa-home"></i>
                <span>املاک <strong>اخلاصی</strong></span>
            </a>
        </div>
        <div class="header-center">
            <nav>
                <a href="/#properties">ملک‌ها</a>
                <a href="/#advisors">مشاورین</a>
                <a href="/#commission">کمیسیون</a>
                <a href="/#about">درباره ما</a>
                <a href="/#contact">تماس</a>
            </nav>
        </div>
        <div class="header-right">
            <button class="btn-free" onclick="window.location.href='/login.html'">
                <i class="fas fa-plus-circle"></i> ثبت رایگان آگهی
            </button>
            <button class="btn-login" onclick="window.location.href='/login.html'">ورود</button>
            <button class="menu-toggle" id="menuToggle">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </div>
</header>

<!-- CHANGE PASSWORD SECTION -->
<section class="login-section">
    <div class="container">
        <div class="login-wrapper">
            <div class="login-box">
                <div class="login-header">
                    <i class="fas fa-key"></i>
                    <h2>تغییر <span>رمز عبور</span></h2>
                    <p>رمز عبور جدید خود را وارد کنید</p>
                </div>

                <form id="changePasswordForm">
                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> رمز فعلی</label>
                        <input type="password" id="currentPassword" required placeholder="رمز فعلی را وارد کنید" />
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> رمز جدید</label>
                        <input type="password" id="newPassword" required placeholder="رمز جدید (حداقل ۶ کاراکتر)" />
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-check-circle"></i> تکرار رمز جدید</label>
                        <input type="password" id="confirmPassword" required placeholder="رمز جدید را مجدداً وارد کنید" />
                    </div>
                    <button type="submit" class="btn-primary full">
                        <i class="fas fa-save"></i> تغییر رمز
                    </button>
                    <div class="login-error" id="changeError"></div>
                    <div class="login-footer">
                        <a href="/login.html">بازگشت به ورود</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>

<!-- FOOTER -->
<footer class="footer">
    <div class="container">
        <div class="footer-grid">
            <div class="footer-brand">
                <a href="/" class="logo"><i class="fas fa-home"></i> املاک <strong>اخلاصی</strong></a>
                <p>۱۴ سال سابقه درخشان در بندرعباس</p>
            </div>
            <div class="footer-links">
                <h4>دسترسی سریع</h4>
                <a href="/#properties">ملک‌ها</a>
                <a href="/#advisors">مشاورین</a>
                <a href="/#contact">تماس</a>
            </div>
            <div class="footer-contact">
                <h4>تماس با ما</h4>
                <p><i class="fas fa-phone"></i> ۰۹۱۷۹۷۷۴۷۰۴</p>
                <p><i class="fas fa-phone"></i> ۰۹۱۷۷۶۰۶۸۶۱</p>
                <p><i class="fas fa-phone"></i> ۰۹۱۷۳۶۶۸۵۲۵</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p>© 2026 <strong>املاک اخلاصی</strong>. تمامی حقوق محفوظ است.</p>
        </div>
    </div>
</footer>

<script>
document.getElementById('changePasswordForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const current = document.getElementById('currentPassword').value.trim();
    const newPass = document.getElementById('newPassword').value.trim();
    const confirmPass = document.getElementById('confirmPassword').value.trim();
    const error = document.getElementById('changeError');

    const savedPassword = localStorage.getItem('realestate_admin_password') || 'admin123';

    if (current !== savedPassword) {
        error.textContent = '❌ رمز فعلی اشتباه است';
        error.style.display = 'block';
        setTimeout(() => { error.style.display = 'none'; }, 3000);
        return;
    }

    if (newPass.length < 6) {
        error.textContent = '❌ رمز جدید باید حداقل ۶ کاراکتر باشد';
        error.style.display = 'block';
        setTimeout(() => { error.style.display = 'none'; }, 3000);
        return;
    }

    if (newPass !== confirmPass) {
        error.textContent = '❌ رمز جدید و تکرار آن مطابقت ندارند';
        error.style.display = 'block';
        setTimeout(() => { error.style.display = 'none'; }, 3000);
        return;
    }

    localStorage.setItem('realestate_admin_password', newPass);
    error.style.color = '#27ae60';
    error.textContent = '✅ رمز عبور با موفقیت تغییر کرد';
    error.style.display = 'block';
    setTimeout(() => {
        window.location.href = '/login.html';
    }, 2000);
});

// Menu toggle
document.getElementById('menuToggle').addEventListener('click', function() {
    const nav = document.querySelector('.header-center nav');
    nav.classList.toggle('open');
    const icon = this.querySelector('i');
    icon.classList.toggle('fa-bars');
    icon.classList.toggle('fa-times');
});
</script>

</body>
</html>
